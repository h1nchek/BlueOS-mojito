name: Build BlueOS for Redmi Note 10 (mojito)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel build jobs (0 = use safe default, up to 8)"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: blueos-mojito-build
  cancel-in-progress: false

jobs:
  build:
    # Register a Linux x86_64 self-hosted runner with >=32 GiB RAM and
    # >=350 GiB free SSD. Standard GitHub-hosted runners are too small.
    runs-on: [self-hosted, linux, x64, android-build]
    timeout-minutes: 360
    env:
      ANDROID_DIR: ${{ runner.temp }}/android/blueos-mojito
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Check build host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == x86_64 ]]
          command -v repo
          command -v git
          command -v python3
          command -v java
          java -version
          mem_gib="$(awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo)"
          free_gib="$(df -BG "${RUNNER_TEMP}" | awk 'NR==2 {gsub(/G/,"",$4); print $4}')"
          echo "RAM: ${mem_gib} GiB; free workspace disk: ${free_gib} GiB"
          if (( mem_gib < 32 )); then
            echo "ERROR: at least 32 GiB RAM is recommended." >&2
            exit 1
          fi
          if (( free_gib < 350 )); then
            echo "ERROR: at least 350 GiB free SSD is required." >&2
            exit 1
          fi

      - name: Build BlueOS
        shell: bash
        env:
          JOBS_INPUT: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          if [[ "${JOBS_INPUT:-8}" == "0" || -z "${JOBS_INPUT:-}" ]]; then
            export JOBS=8
          elif [[ "${JOBS_INPUT}" =~ ^[1-9][0-9]*$ ]]; then
            export JOBS="$JOBS_INPUT"
          else
            echo "ERROR: jobs must be 0 or a positive integer." >&2
            exit 1
          fi
          ./scripts/build.sh "$ANDROID_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect ROM ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          product_dir="$ANDROID_DIR/out/target/product/mojito"
          [[ -d "$product_dir" ]] || { echo "Missing product output: $product_dir" >&2; exit 1; }
          # Exclude target-files archives: they are build inputs, not recovery-installable ROM packages.
          mapfile -d '' zips < <(find "$product_dir" -maxdepth 1 -type f -name '*.zip' ! -iname '*target_files*' -size +100M -print0)
          if (( ${#zips[@]} == 0 )); then
            echo "ERROR: no ROM ZIP larger than 100 MiB was produced." >&2
            find "$product_dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            exit 1
          fi
          mkdir -p "$ARTIFACT_DIR"
          for zip in "${zips[@]}"; do
            python3 - "$zip" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          if not zipfile.is_zipfile(path):
              raise SystemExit(f"ERROR: output is not a valid ZIP archive: {path}")
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
          markers = {
              "payload.bin",
              "META-INF/com/android/metadata",
              "META-INF/com/google/android/update-binary",
          }
          if not names.intersection(markers):
              raise SystemExit(f"ERROR: ZIP lacks a recognized Android OTA installer marker: {path}")
          print(f"Validated Android OTA ZIP structure: {path}")
          PY
            cp "$zip" "$ARTIFACT_DIR/"
          done
          (
            cd "$ARTIFACT_DIR"
            sha256sum ./*.zip > SHA256SUMS.txt
          )
          ls -lh "$ARTIFACT_DIR"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueOS-mojito-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flashable ZIP and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: BlueOS-mojito-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
