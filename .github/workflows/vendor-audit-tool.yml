name: Vendor audit utility

on:
  push:
    paths:
      - "scripts/audit-vendor-blobs.py"
      - "scripts/audit-vintf.py"
      - "scripts/audit-soong-deps.py"
      - "scripts/patch-mojito-device-tree.py"
      - "scripts/validate_ota_zip.py"
      - "scripts/audit_repo_manifests.py"
      - "manifests/*.xml"
      - "tests/test_vendor_blob_audit.py"
      - "tests/test_vintf_audit.py"
      - "tests/test_soong_audit.py"
      - "tests/test_device_tree_patch.py"
      - "tests/test_validate_ota_zip.py"
      - "tests/test_repo_manifest_audit.py"
      - ".github/workflows/vendor-audit-tool.yml"
  pull_request:
    paths:
      - "scripts/audit-vendor-blobs.py"
      - "scripts/audit-vintf.py"
      - "scripts/audit-soong-deps.py"
      - "scripts/patch-mojito-device-tree.py"
      - "scripts/validate_ota_zip.py"
      - "scripts/audit_repo_manifests.py"
      - "manifests/*.xml"
      - "tests/test_vendor_blob_audit.py"
      - "tests/test_vintf_audit.py"
      - "tests/test_soong_audit.py"
      - "tests/test_device_tree_patch.py"
      - "tests/test_validate_ota_zip.py"
      - "tests/test_repo_manifest_audit.py"
      - ".github/workflows/vendor-audit-tool.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python utilities and tests
        run: |
          python -m py_compile scripts/*.py tests/*.py
      - name: Check shell script syntax
        run: bash -n scripts/build.sh
      - name: Validate XML manifests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = sorted(Path("manifests").glob("*.xml"))
          if not files:
              raise SystemExit("No XML manifests found")
          for path in files:
              ET.parse(path)
              print(f"OK: {path}")
          PY
          python scripts/audit_repo_manifests.py manifests/*.xml
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
