name: Build BlueOS for Redmi Note 10 (mojito)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Build BlueOS once (default), or clean LineageOS for diagnosis"
        required: true
        default: "blueos"
        type: choice
        options: [lineage, blueos]
      jobs:
        description: "Parallel build jobs (0 = safe default, up to 8)"
        required: false
        default: "8"
        type: string
permissions:
  contents: read
concurrency:
  group: mojito-build-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, linux, x64, android-build]
    timeout-minutes: 360
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Set build paths
        shell: bash
        env:
          STAGE_INPUT: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          [[ "$STAGE_INPUT" == lineage || "$STAGE_INPUT" == blueos ]]
          echo "BUILD_STAGE=$STAGE_INPUT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$RUNNER_TEMP/android/mojito-$STAGE_INPUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$GITHUB_WORKSPACE/artifacts" >> "$GITHUB_ENV"
      - name: Check build host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == x86_64 ]]
          command -v repo
          command -v git
          command -v python3
          command -v java
          java -version
          mem_gib="$(awk '/MemTotal/ {print int($2/1024/1024)}' /proc/meminfo)"
          free_gib="$(df -BG "$RUNNER_TEMP" | awk 'NR==2 {gsub(/G/,"",$4); print $4}')"
          echo "RAM: ${mem_gib} GiB; free workspace disk: ${free_gib} GiB"
          (( mem_gib >= 32 )) || { echo "ERROR: at least 32 GiB RAM is recommended." >&2; exit 1; }
          (( free_gib >= 350 )) || { echo "ERROR: at least 350 GiB free SSD is required." >&2; exit 1; }
      - name: Build selected stage
        shell: bash
        env:
          JOBS_INPUT: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          if [[ "${JOBS_INPUT:-8}" == 0 || -z "${JOBS_INPUT:-}" ]]; then
            export JOBS=8
          elif [[ "$JOBS_INPUT" =~ ^[1-9][0-9]*$ ]] && (( JOBS_INPUT <= 8 )); then
            export JOBS="$JOBS_INPUT"
          else
            echo "ERROR: jobs must be 0 or an integer from 1 to 8." >&2
            exit 1
          fi
          ./scripts/build.sh "$ANDROID_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Collect ROM ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          product_dir="$ANDROID_DIR/out/target/product/mojito"
          [[ -d "$product_dir" ]] || { echo "Missing product output: $product_dir" >&2; exit 1; }
          mapfile -d '' zips < <(find "$product_dir" -maxdepth 1 -type f -name '*.zip' ! -iname '*target_files*' -size +100M -print0)
          if (( ${#zips[@]} == 0 )); then
            echo "ERROR: no ROM ZIP larger than 100 MiB was produced." >&2
            find "$product_dir" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            exit 1
          fi
          mkdir -p "$ARTIFACT_DIR"
          for zip in "${zips[@]}"; do
            python3 "$GITHUB_WORKSPACE/scripts/validate_ota_zip.py" "$zip"
            cp "$zip" "$ARTIFACT_DIR/"
          done
          cp "$GITHUB_WORKSPACE/resolved-manifest-$BUILD_STAGE.xml" "$ARTIFACT_DIR/"
          ( cd "$ARTIFACT_DIR" && sha256sum ./*.zip > SHA256SUMS.txt )
          ls -lh "$ARTIFACT_DIR"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojito-${{ inputs.stage }}-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload ROM ZIP, checksum and resolved manifest
        uses: actions/upload-artifact@v4
        with:
          name: mojito-${{ inputs.stage }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
