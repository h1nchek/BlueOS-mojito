name: Vendor audit utility

on:
  push:
    paths:
      - "scripts/audit-vendor-blobs.py"
      - "tests/test_vendor_blob_audit.py"
      - ".github/workflows/vendor-audit-tool.yml"
  pull_request:
    paths:
      - "scripts/audit-vendor-blobs.py"
      - "tests/test_vendor_blob_audit.py"
      - ".github/workflows/vendor-audit-tool.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile audit utility
        run: python -m py_compile scripts/audit-vendor-blobs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
